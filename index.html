<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de E-mails Educacionais</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f8fc;
            padding: 40px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #0056a8;
            font-size: 36px;
            margin-top: 10px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .container {
            text-align: center;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        p {
            font-size: 18px;
            color: #444;
        }
        .input-field {
            margin: 10px 0;
            padding: 10px;
            width: 90%;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .generate-btn, .upload-btn {
            background-color: #0056a8;
            color: white;
            padding: 12px 20px;
            border: none;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        .generate-btn:hover, .upload-btn:hover {
            background-color: #004080;
        }
        .result-email {
            font-size: 16px;
            color: #333;
            margin: 5px 0;
        }
        .copy-btn {
            background-color: #e6272e;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        .copy-btn:hover {
            background-color: #b51c21;
        }
        .download-btn {
            display: none;
            margin-top: 20px;
            background-color: #e6272e;
            color: white;
            padding: 12px 20px;
            border: none;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }
        .download-btn:hover {
            background-color: #b51c21;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

    <div class="logo-container">
    </div>

    <h1>Criador de E-mails Educacionais</h1>

    <div class="container">
        <p>Digite até três nomes completos ou faça upload de um arquivo Excel com vários nomes.</p>

        <input type="text" id="name1" class="input-field" placeholder="Nome Completo 1" oninput="clearResult(1)">
        <div id="result1" class="result-email"></div>

        <input type="text" id="name2" class="input-field" placeholder="Nome Completo 2" oninput="clearResult(2)">
        <div id="result2" class="result-email"></div>

        <input type="text" id="name3" class="input-field" placeholder="Nome Completo 3" oninput="clearResult(3)">
        <div id="result3" class="result-email"></div>

        <button id="generate-btn" class="generate-btn" onclick="generateEmails()">Gerar E-mails Educacionais</button>

        <hr>

        <input type="file" id="file-upload" class="input-field" accept=".xlsx, .xls">
        <button id="upload-btn" class="upload-btn" onclick="processExcel()">Gerar E-mails Educacionais</button>

        <a id="download-btn" class="download-btn">Baixar Resultado</a>
    </div>

    <script>
    function removeAccents(text) {
        return text.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function createEmail(fullName) {
        if (!fullName || typeof fullName !== 'string') return '';

        const normalizedFullName = removeAccents(fullName).toUpperCase();
        const nameParts = normalizedFullName.split(' ')
            .filter(part => part && !['DE', 'DA', 'DOS', 'DO', 'DI'].includes(part));

        if (nameParts.length < 2) return ''; // precisa de pelo menos 2 partes úteis

        const initials = nameParts.slice(0, -1).map(part => part[0].toLowerCase()).join('').slice(0, 4);
        const lastName = nameParts[nameParts.length - 1]?.toLowerCase();

        if (!lastName) return '';

        return `${initials}.${lastName}@branta.com.br`;
    }

    function generateEmails() {
        const inputs = [
            { id: 'name1', resultId: 'result1' },
            { id: 'name2', resultId: 'result2' },
            { id: 'name3', resultId: 'result3' }
        ];

        inputs.forEach(input => {
            const fullName = document.getElementById(input.id).value.trim();
            if (fullName) {
                const email = createEmail(fullName);
                document.getElementById(input.resultId).innerHTML = `
                    <span><strong>${email}</strong></span>
                    <button class="copy-btn" onclick="copyToClipboard('${email}')">Copiar</button>
                `;
            }
        });
    }

    function clearResult(index) {
        document.getElementById(`result${index}`).innerHTML = '';
    }

    function processExcel() {
        const fileUpload = document.getElementById('file-upload').files[0];
        if (!fileUpload) {
            alert("Por favor, selecione um arquivo Excel primeiro.");
            return;
        }

        const reader = new FileReader();
        reader.onload = function (e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

            let uniqueNames = new Set();
            let emails = [];
            let emailSet = new Set();

            jsonData.forEach(row => {
                if (row.length > 0 && typeof row[0] === 'string' && row[0].trim() !== '') {
                    const fullName = row[0].trim();

                    if (!uniqueNames.has(fullName)) {
                        uniqueNames.add(fullName);

                        let email = createEmail(fullName);

                        // Verifica se o e-mail já existe e modifica se necessário
                        if (emailSet.has(email)) {
                            const nameParts = removeAccents(fullName).toLowerCase().split(' ');
                            const initial = nameParts[0]?.[0] || 'x';
                            const lastName = nameParts[nameParts.length - 1] || 'user';
                            email = `${initial}.${lastName}@branta.com.br`;
                        }

                        if (email) {
                            emailSet.add(email);
                            emails.push([fullName, email]);
                        }
                    }
                }
            });

            const worksheetResult = XLSX.utils.aoa_to_sheet([["Nome Completo", "E-mail"]].concat(emails));
            const newWorkbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWorkbook, worksheetResult, "Resultado");
            const resultFile = XLSX.write(newWorkbook, { bookType: 'xlsx', type: 'array' });

            const blob = new Blob([resultFile], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const downloadBtn = document.getElementById('download-btn');
            downloadBtn.href = url;
            downloadBtn.download = 'emails_gerados.xlsx';
            downloadBtn.style.display = 'inline-block';
            downloadBtn.textContent = 'Baixar Resultado';
        };

        reader.readAsArrayBuffer(fileUpload);
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert('E-mail copiado: ' + text);
        });
    }
</script>

            });
        }
    </script>

</body>
</html>
